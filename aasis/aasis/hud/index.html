<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AASIS HUD</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#02080d">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
  :root { --c:#00d9ff; --bg:#02080d; --dim:#0a2a36; --txt:#bfefff; }
  * { box-sizing:border-box; }
  body { margin:0; background:radial-gradient(circle at 50% 40%, #06202c, var(--bg) 70%); color:var(--txt);
         font-family:"Consolas","Courier New",monospace; height:100vh; height:100dvh; display:grid;
         grid-template-columns:220px 1fr 280px; grid-template-rows:1fr auto; gap:12px; padding:14px; }
  .panel { border:1px solid var(--dim); background:rgba(0,217,255,.04); padding:10px; overflow:hidden; }
  h2 { margin:0 0 8px; font-size:12px; letter-spacing:.2em; color:var(--c); font-weight:normal; }
  .bar { height:8px; background:var(--dim); margin:4px 0 12px; } .bar i { display:block; height:100%; width:0; background:var(--c); transition:width .6s; }
  #center { display:flex; flex-direction:column; align-items:center; justify-content:center; }
  canvas { width:min(60vh,100%); aspect-ratio:1; }
  #status { margin-top:6px; letter-spacing:.35em; color:var(--c); }
  #log { font-size:12px; overflow-y:auto; height:calc(100% - 24px); }
  #log div { margin-bottom:8px; border-left:2px solid var(--c); padding-left:6px; word-break:break-word; }
  #bottom { grid-column:1 / 4; display:flex; flex-direction:column; gap:8px; }
  #transcript { min-height:48px; max-height:110px; overflow-y:auto; font-size:14px; }
  #transcript .you { color:#7aa; } #transcript .bot { color:var(--txt); }
  form { display:flex; gap:8px; }
  input { flex:1; min-width:0; background:transparent; border:1px solid var(--c); color:var(--txt); padding:10px; font:inherit; }
  button { flex-shrink:0; background:var(--c); color:#001018; border:0; padding:0 18px; font:inherit; cursor:pointer; }
  #modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.75); align-items:center; justify-content:center; }
  #modal.on { display:flex; } #modal .box { border:1px solid #ffb300; background:#120d00; padding:24px; max-width:520px; }
  #modal p { color:#ffb300; word-break:break-word; } #modal button + button { background:#444; color:#fff; margin-left:8px; }
  #chips { display:flex; gap:6px; flex-wrap:wrap; } #chips button { background:transparent; color:var(--c); border:1px solid var(--dim); min-height:30px; padding:0 10px; }
  .mrow { font-size:12px; margin-bottom:4px; display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .dot { width:8px; height:8px; border-radius:50%; display:inline-block; }
  .mrow button { min-height:24px; padding:0 6px; font-size:11px; } .mrow a { color:var(--c); }
  #deep.on { background:var(--c); color:#001018; }
  #alerts { position:fixed; top:10px; left:10px; right:10px; z-index:8; display:flex; flex-direction:column; gap:8px; pointer-events:none; }
  .alert { pointer-events:auto; border:1px solid #ffb300; background:#120d00; color:#ffb300; padding:12px; display:flex; gap:10px; align-items:center; justify-content:space-between; }
  .alert button { background:#ffb300; min-height:36px; }
  #mic.on { background:#ffb300; } #mic, #spk { padding:0 14px; }
  #spk.off { background:#444; color:#bbb; }
  #login { display:none; position:fixed; inset:0; background:var(--bg); align-items:center; justify-content:center; z-index:9; }
  #login.on { display:flex; } #login form { flex-direction:column; width:min(90vw,360px); }
  #login p { color:#ffb300; min-height:1.2em; margin:0; }
  @media (max-width:800px){
    body{grid-template-columns:1fr; grid-template-rows:auto; height:auto; min-height:100dvh; padding:10px;}
    #center{order:-1;} canvas{width:min(70vw,45vh);} #bottom{grid-column:1; position:sticky; bottom:0; background:var(--bg);}
    #log{height:120px;} input{font-size:16px;} button{min-height:44px;} #f{gap:6px;} #mic,#spk{padding:0 10px;} #f button:last-child{padding:0 12px;}
  }
</style>
</head>
<body>
<div class="panel"><h2>SISTEMA</h2>
  CPU <span id="cpuv">--</span>%<div class="bar"><i id="cpu"></i></div>
  RAM <span id="ramv">--</span>%<div class="bar"><i id="ram"></i></div>
  <div id="ubox" style="display:none">TOKENS HOJE <span id="uv">--</span><div class="bar"><i id="ub"></i></div></div>
  <h2>LINK</h2><span id="link">OFFLINE</span>
  <div id="mbox" style="display:none;margin-top:12px"><h2>MODELOS</h2><div id="models"></div><div id="lastmodel" style="margin-top:6px;opacity:.8"></div></div>
  <div id="gbox" style="display:none;margin-top:12px"><h2>GOOGLE</h2><span id="gst"></span> <button type="button" id="gbtn" style="min-height:32px;padding:0 10px">CONECTAR</button></div>
</div>
<div class="panel" id="center"><canvas id="reactor" width="600" height="600"></canvas><div id="status">STANDBY</div></div>
<div class="panel"><h2>FERRAMENTAS</h2><div id="log"></div></div>
<div class="panel" id="bottom">
  <div id="transcript"></div>
  <div id="chips"><button type="button" data-q="Faça meu resumo do dia.">☀ Resumo do dia</button><button type="button" data-q="Quais são minhas tarefas pendentes?">☑ Tarefas</button><button type="button" data-q="Quais lembretes tenho pendentes?">⏰ Lembretes</button><button type="button" id="deep" title="Usa o modelo mais capaz na próxima pergunta">🧠 Profundo</button><button type="button" id="bell">🔔 Avisos</button></div>
  <form id="f"><button type="button" id="mic" title="Falar">🎤</button><button type="button" id="spk" class="off" title="Ler respostas em voz alta">🔊</button>
    <input id="q" autocomplete="off" placeholder="Digite ou fale um comando..."><button>ENVIAR</button></form>
</div>
<div id="alerts"></div>
<div id="login"><form id="lf"><h2>CÓDIGO DE ACESSO</h2><input id="code" type="password" autocomplete="current-password" placeholder="Código do AASIS"><p id="lerr"></p><button>ENTRAR</button></form></div>
<div id="modal"><div class="box"><h2>CONFIRMAÇÃO NECESSÁRIA</h2><p id="act"></p>
  <button id="yes">AUTORIZAR</button><button id="no">NEGAR</button></div></div>
<script>
let TOKEN = "__TOKEN__"; // vazio no modo remoto: o código é digitado e fica só neste aparelho
try { if (!TOKEN) TOKEN = localStorage.getItem("aasis_code") || ""; } catch (e) {}
const COLORS = {standby:"#00d9ff", listening:"#ffb300", thinking:"#ffffff", speaking:"#3dff9a"};
let state = "standby", t = 0;
const $ = id => document.getElementById(id);
const post = (path, body) => fetch(path, {method:"POST", headers:{"X-Token":TOKEN,"Content-Type":"application/json"}, body:JSON.stringify(body)});

function setState(s) { state = s; $("status").textContent = s.toUpperCase(); $("status").style.color = COLORS[s] || COLORS.standby; }
function addLine(cls, who, text) {
  const d = document.createElement("div"); d.className = cls; d.textContent = who + ": " + text;
  $("transcript").appendChild(d); $("transcript").scrollTop = 1e9;
}
function addSources(items) {  // só links http(s); texto via textContent (sem HTML da internet)
  const d = document.createElement("div"); d.className = "bot"; d.append("Fontes: ");
  items.filter(x => /^https?:\/\//i.test(x.url)).forEach((x, i, a) => {
    const l = document.createElement("a"); l.href = x.url; l.textContent = String(x.title).slice(0, 60);
    l.target = "_blank"; l.rel = "noopener noreferrer"; l.style.color = "var(--c)"; d.append(l, i < a.length - 1 ? " · " : "");
  });
  $("transcript").appendChild(d); $("transcript").scrollTop = 1e9;
}
function addTool(name, args, result) {
  const d = document.createElement("div");
  d.textContent = name + " " + JSON.stringify(args) + (result ? " → " + String(result).slice(0,160) : "");
  $("log").prepend(d);
}
// Registro persistente de ações (sobrevive a reinícios); o resultado nunca é guardado, só ferramenta, argumentos e status
async function loadModels() {
  try {
    const r = await fetch("/llm/status?token=" + encodeURIComponent(TOKEN)); if (!r.ok) return;
    const rows = await r.json(); if (!Array.isArray(rows)) return;
    $("mbox").style.display = "block"; $("models").textContent = "";
    for (const m of rows) {
      const d = document.createElement("div"); d.className = "mrow";
      const dot = document.createElement("span"); dot.className = "dot";
      dot.style.background = !m.available ? "#555" : m.paused ? "#ffb300" : (m.last && m.last.error) ? "#ff5252" : "#3dff9a";
      const name = document.createElement("span");
      name.textContent = m.alias + " · " + m.provider + (m.trust === "external" ? " ⚠" : "");
      name.title = m.available ? (m.id + " | " + m.tokens_today + " tokens hoje" + (m.paused ? " | pausado " + m.paused + "s" : ""))
                               : (m.reason || "indisponível");
      d.append(dot, name);
      if (m.available) {
        const b = document.createElement("button"); b.type = "button"; b.textContent = "testar";
        b.onclick = async () => { b.textContent = "..."; try {
            const t = await (await post("/llm/test", {alias: m.alias})).json();
            b.textContent = t.ok ? t.latency_ms + " ms" : "erro: " + t.error; } catch (e) { b.textContent = "falhou"; }
          setTimeout(loadModels, 2500); };
        d.append(b);
      } else if (m.reason) { const r2 = document.createElement("span"); r2.style.opacity = ".6"; r2.textContent = m.reason; d.append(r2); }
      if (m.available && m.provider) { const a = document.createElement("a"); a.textContent = "IDs"; a.target = "_blank"; a.rel = "noopener";
        a.href = "/llm/models?provider=" + encodeURIComponent(m.provider) + "&token=" + encodeURIComponent(TOKEN); d.append(a); }
      $("models").appendChild(d);
    }
  } catch (e) {}
}
async function loadAudit() {
  try {
    const r = await fetch("/audit?token=" + encodeURIComponent(TOKEN)); if (!r.ok) return;
    const rows = await r.json(); $("log").textContent = "";
    for (const a of rows.reverse()) { const d = document.createElement("div");
      d.textContent = a.ts.slice(5, 16) + " " + a.tool + " " + a.args.slice(0, 80) + " [" + a.status + "]";
      if (a.status !== "ok") d.style.borderColor = "#ffb300"; $("log").prepend(d); }
  } catch (e) {}
}

let es = null, opened = false;
function onMsg(e) {
  const m = JSON.parse(e.data);
  if (m.type === "state") setState(m.state);
  else if (m.type === "user") addLine("you", "Você", m.text);
  else if (m.type === "assistant") { addLine("bot", "AASIS", m.text); speak(m.text); }
  else if (m.type === "tool") addTool(m.name, m.args, m.result);
  else if (m.type === "stats") { $("cpu").style.width = m.cpu + "%"; $("ram").style.width = m.ram + "%";
    $("cpuv").textContent = Math.round(m.cpu); $("ramv").textContent = Math.round(m.ram); }
  else if (m.type === "google") { $("gbox").style.display = m.available ? "block" : "none";
    $("gst").textContent = m.connected ? "conectado" : "desconectado"; $("gbtn").style.display = m.connected ? "none" : "inline"; }
  else if (m.type === "usage") { $("ubox").style.display = "block";
    $("uv").textContent = m.limit ? m.used + " / " + m.limit : m.used + " (sem limite)";
    $("ub").style.width = m.limit ? Math.min(100, m.used / m.limit * 100) + "%" : "0"; }
  else if (m.type === "model") $("lastmodel").textContent = "último: " + m.alias + " (" + m.provider + ")";
  else if (m.type === "sources") addSources(m.items);
  else if (m.type === "notice") addLine("bot", "Aviso", m.text);
  else if (m.type === "reminder") showReminder(m);
  else if (m.type === "confirm") { $("act").textContent = m.action; $("modal").classList.add("on"); }
}
function connect() {
  if (!TOKEN) { $("login").classList.add("on"); return; }
  opened = false;
  es = new EventSource("/events?token=" + encodeURIComponent(TOKEN));
  es.onopen = () => { opened = true; $("link").textContent = "ONLINE"; $("login").classList.remove("on"); loadAudit(); loadModels(); };
  es.onmessage = onMsg;
  es.onerror = () => {
    $("link").textContent = "OFFLINE";
    if (!opened) { es.close(); try { localStorage.removeItem("aasis_code"); } catch (e) {}  // código recusado
      TOKEN = ""; $("lerr").textContent = "Código inválido ou bloqueado."; $("login").classList.add("on"); }
  };
}
$("gbtn").onclick = () => { location.href = "/google/start?token=" + encodeURIComponent(TOKEN); };
$("lf").onsubmit = ev => { ev.preventDefault(); TOKEN = $("code").value;
  try { localStorage.setItem("aasis_code", TOKEN); } catch (e) {} $("lerr").textContent = ""; connect(); };

// Lembretes: ficam na tela até você tocar em OK (o servidor reenvia a cada 60 s; deduplicado por id)
function showReminder(m) {
  const id = "r" + m.id; let el = document.getElementById(id);
  if (!el) {
    el = document.createElement("div"); el.className = "alert"; el.id = id;
    const t = document.createElement("span"); t.textContent = "⏰ " + m.text;
    const b = document.createElement("button"); b.textContent = "OK";
    b.onclick = () => { post("/ack", {id: m.id}); el.remove(); };
    el.append(t, b); $("alerts").appendChild(el);
    speak("Lembrete: " + m.text); try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {}
  }
  if (window.Notification && Notification.permission === "granted" && navigator.serviceWorker)
    navigator.serviceWorker.ready.then(r => r.showNotification("AASIS", {body: m.text, tag: id})).catch(() => {});
}
$("bell").onclick = () => { if (window.Notification) Notification.requestPermission().then(p => { $("bell").textContent = p === "granted" ? "🔔 Ativados" : "🔕 Bloqueados"; }); };
document.querySelectorAll("#chips button[data-q]").forEach(b => b.onclick = () => ask(b.dataset.q));

// Voz no navegador (Android/Chrome). O reconhecimento usa o serviço de voz do Google.
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let speakOn = false;
function speak(t) {
  if (!speakOn || !window.speechSynthesis) return;
  const u = new SpeechSynthesisUtterance(t); u.lang = "pt-BR"; speechSynthesis.cancel(); speechSynthesis.speak(u);
}
$("spk").onclick = () => { speakOn = !speakOn; $("spk").classList.toggle("off", !speakOn);
  if (speakOn && window.speechSynthesis) speechSynthesis.speak(new SpeechSynthesisUtterance(" ")); };  // libera o áudio
if (!SR) { $("mic").style.display = "none"; } else {
  const rec = new SR(); rec.lang = "pt-BR"; rec.interimResults = false; rec.maxAlternatives = 1;
  rec.onstart = () => { $("mic").classList.add("on"); setState("listening"); };
  rec.onend = () => { $("mic").classList.remove("on"); if (state === "listening") setState("standby"); };
  rec.onresult = e => ask(e.results[0][0].transcript);
  $("mic").onclick = () => { try { rec.start(); } catch (e) {} };
}
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
connect();
let deepOn = false;
function ask(text) { post("/ask", deepOn ? {text, deep: true} : {text}); deepOn = false; $("deep").classList.remove("on"); }
$("deep").onclick = () => { deepOn = !deepOn; $("deep").classList.toggle("on", deepOn); };
$("f").onsubmit = ev => { ev.preventDefault(); const v = $("q").value.trim(); if (!v) return; $("q").value = ""; ask(v); };
const answer = ok => { $("modal").classList.remove("on"); post("/confirm", {ok}); };
$("yes").onclick = () => answer(true); $("no").onclick = () => answer(false);

// Reator de arco animado
const cv = $("reactor"), g = cv.getContext("2d");
function ring(r, w, segs, gap, rot, color, alpha) {
  g.strokeStyle = color; g.globalAlpha = alpha; g.lineWidth = w;
  const step = Math.PI * 2 / segs;
  for (let i = 0; i < segs; i++) { g.beginPath(); g.arc(300, 300, r, rot + i*step, rot + (i+1)*step - gap); g.stroke(); }
}
function draw() {
  t += state === "thinking" ? 0.035 : state === "listening" ? 0.02 : 0.008;
  const col = COLORS[state] || COLORS.standby, pulse = 1 + Math.sin(t * (state === "speaking" ? 18 : 4)) * (state === "speaking" ? .06 : .02);
  g.clearRect(0, 0, 600, 600);
  ring(270, 3, 60, .04, t, col, .35);
  ring(235, 6, 3, .35, -t * 1.6, col, .7);
  ring(195, 2, 24, .1, t * 2.2, col, .5);
  ring(150 * pulse, 10, 9, .25, -t * 3, col, .9);
  const grad = g.createRadialGradient(300, 300, 5, 300, 300, 95 * pulse);
  grad.addColorStop(0, "#fff"); grad.addColorStop(.35, col); grad.addColorStop(1, "transparent");
  g.globalAlpha = 1; g.fillStyle = grad; g.beginPath(); g.arc(300, 300, 95 * pulse, 0, 7); g.fill();
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
