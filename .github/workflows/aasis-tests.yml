name: AASIS tests

# Roda os testes do AASIS em Linux (Python 3.10, o mínimo, e 3.12) e em Windows. Só quando algo em aasis/ muda.
on:
  push:
    paths: ["aasis/**", ".github/workflows/aasis-tests.yml"]
  pull_request:
    paths: ["aasis/**", ".github/workflows/aasis-tests.yml"]
  workflow_dispatch:

jobs:
  test:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: windows-latest, python: "3.12" }
    defaults:
      run:
        working-directory: aasis
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt pytest
      - name: Testes
        run: python -m pytest -q tests
